name: IRC addressed delivery verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the published CLI
        run: npm install -g @arxo/cli@0.2.4
      - name: Verify the immutable public inventory
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/irc-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$snapshot"
          git archive HEAD | tar -x -C "$snapshot"
          python3 tools/canon_publication.py verify --artifact "$snapshot"
      - name: Verify addressed reader examples, without package suites or corpus
        run: python3 tools/check.py --report "$RUNNER_TEMP/irc-linux-verification.json"
      - name: Inspect the README answer with its pinned source snapshot
        run: law inspect examples/eitc/result.json summary --snapshot .runtime/eitc.json
      - uses: actions/upload-artifact@v4
        with:
          name: irc-linux-addressed-verification
          path: ${{ runner.temp }}/irc-linux-verification.json
