<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="338" viewBox="0 0 1240 338" role="img"><title>Section 1042 with and without a supplied backward calendar boundary</title><rect width="1240" height="338" rx="24" fill="#f5f0e6"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#162d46">BACKWARD CALENDAR BOUNDARIES ARE EXPLICIT INPUTS</text><text x="32" y="83" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#162d46">§1042 replacement-period start · sale date 2025-06-30 · three calendar months before</text><rect x="32" y="117" width="550" height="112" rx="15" fill="white" stroke="#d5dcd9"/><text x="52" y="155" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Boundary supplied: 2025-03-30</text><text x="52" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#647480">Established start-date collection: [2025-03-30]</text><rect x="654" y="117" width="550" height="112" rx="15" fill="white" stroke="#d5dcd9"/><text x="674" y="155" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Boundary absent</text><text x="674" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#647480">Established start-date collection: []</text><text x="32" y="285" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#162d46">Both collection queries report COMPUTED. An empty collection establishes no date; it does not establish zero or false.</text></svg>
