<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="295" viewBox="0 0 1240 295" role="img"><title>Model, explicit facts and legal date flow through Arxo into an answer and proof</title><rect width="1240" height="295" rx="24" fill="#f5f0e6"/><text x="32" y="44" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#162d46">FROM EXPLICIT INPUTS TO A REPRODUCIBLE ANSWER</text><rect x="32" y="82" width="295" height="122" rx="15" fill="white" stroke="#d5dcd9"/><text x="52" y="120" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Model + case + legal date</text><text x="52" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#647480">.law + canonical assertions + context</text><text x="341" y="150" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#162d46">→</text><rect x="390" y="82" width="350" height="122" rx="15" fill="white" stroke="#d5dcd9"/><text x="410" y="120" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">Arxo / native law CLI</text><text x="410" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#647480">Parameters, formulas, rounding and rules</text><text x="756" y="150" font-family="Arial, sans-serif" font-size="35" font-weight="400" fill="#162d46">→</text><rect x="807" y="82" width="400" height="122" rx="15" fill="white" stroke="#d5dcd9"/><text x="827" y="120" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#162d46">$6,197.98 + proof</text><text x="827" y="150" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#647480">Verified EITC example · §32(a)</text><text x="32" y="254" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#162d46">Money and eligibility are different questions. The proof retains the rules, parameter selections and source anchors.</text></svg>
