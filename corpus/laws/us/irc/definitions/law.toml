# Manifest §10 — package root marker (DECISION-0033).
[package]
name = "us.irc.definitions"
version = "0.1.1"
language = "0.2"
namespace = "urn:us:irc:definitions:clir"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "us-irc-definitions"
title = "26 U.S.C. Chapter 79 — Definitions"
primarySource = "IRC_TITLE26"
jurisdiction = "US"
instrument = "code"
sourceFidelity = "pinned_official_bytes"
issuer = "United States Congress; published by the Office of the Law Revision Counsel / U.S. Government Publishing Office"
legalStatus = "in_force"
verifiedAgainstSource = true

[dependencies]
"us.irc.core" = "0.1.1"
"us.irc.inflation_adjustments" = "0.1.1"
"us.irc.temporal" = "0.1.1"

[features]
enabled = ["law.params/0.1"]

# Stage 1 formalization (IRC-05, this agent): classifications.law,
# residency.law, economic-substance.law, marital-status.law,
# life-insurance.law, ptp.law, cpeo.law + their `tests/*.lawtest` suites.
# Stage 2 (DECISION-0379 with deontics): general-terms.law (§7701(a) remainder),
# special-rules.law (§7701(d)-(n),(p)), modified-endowment.law (§7702A),
# long-term-care.law (§7702B + its A3 dataset), and the Public Law 119-21
# modules pl119-21-*.law (§7701(a)(51)-(52), §7704(d)(1)(E)).
# Scenarios are `implemented_unverified` (written, not executed — the
# owner's NO-HEAVY-CHECKS restriction covers `.lawtest` execution).
[[tests]]
family = "us_irc_definitions"
suites = [
    "tests/classifications.lawtest",
    "tests/residency.lawtest",
    "tests/economic-substance.lawtest",
    "tests/marital-status.lawtest",
    "tests/life-insurance.lawtest",
    "tests/ptp.lawtest",
    "tests/cpeo.lawtest",
    "tests/general-terms.lawtest",
    "tests/special-rules.lawtest",
    "tests/modified-endowment.lawtest",
    "tests/long-term-care.lawtest",
    "tests/pl119-21-prohibited-foreign-entity.lawtest",
    "tests/pl119-21-material-assistance.lawtest",
    "tests/pl119-21-ptp-qualifying-income.lawtest",
    "tests/insurance-stage3.lawtest",
    "tests/pl119-21-stage3.lawtest",
    "tests/residency-endowment-worksite-stage3.lawtest",
    "tests/life-insurance-stage3.lawtest",
    "tests/stage3b-definitions.lawtest",
    "tests/check-the-box.lawtest",
]
world = ["us.irc.definitions", "us.irc.core", "us.irc.inflation_adjustments", "us.irc.temporal"]
