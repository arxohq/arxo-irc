# IRC-05 pilot case package (PLAN.ru.md §9): one legally coherent individual
# taxpayer, TY2025 calendar year, exercised across the eight mandatory
# variants. Nested `examples/<case>/` under the canon package it depends on,
# per DECISION-0379 and docs/PACKAGE-LAYOUT.ru.md. This package holds NO
# norms of its own (§168.4/LDC-E1355): only facts and case declarations over
# the imported `us.irc.*` owner packages.
#
# Status: built, `check`-clean, `lock --clir --write` closes the transitive
# dependency graph. The eight `.lawcase` files are NOT executed by this
# agent (hard rule: no `ask`/`engine test`) — see
# docs/foundations/us-irc/PILOT.md for the full NOT_RUN list and the exact
# deferred commands.

[package]
name = "us.irc.examples.pilot_individual_2025"
version = "0.1.1"
language = "0.2"
namespace = "urn:us:irc:examples:pilot-individual-2025"

[dependencies]
"us.irc.core" = "0.1.1"
"us.irc.income_individual" = "0.1.1"
"us.irc.gross_income" = "0.1.1"
"us.irc.credits" = "0.1.1"
"us.irc.returns" = "0.1.1"
"us.irc.payment_refunds_interest" = "0.1.1"
"us.irc.penalties" = "0.1.1"
"us.irc.assessment" = "0.1.1"

[[cases]]
name = "V1FullFactsTimelyPerformance"
path = "cases/v1-full-facts-timely-performance.lawcase"

[[cases]]
name = "V2AlternateEditionDifference"
path = "cases/v2-alternate-edition-difference.lawcase"

[[cases]]
name = "V3ExtensionChangesFilingWindowOnly"
path = "cases/v3-extension-changes-filing-window-only.lawcase"

[[cases]]
name = "V4PartialAndLatePayment"
path = "cases/v4-partial-and-late-payment.lawcase"

[[cases]]
name = "V5UnknownNoticeMailingDate"
path = "cases/v5-unknown-notice-mailing-date.lawcase"

[[cases]]
name = "V6ReasonableCauseDefeatsAddition"
path = "cases/v6-reasonable-cause-defeats-addition.lawcase"

[[cases]]
name = "V7AttemptedAssessmentBlockedByImmunity"
path = "cases/v7-attempted-assessment-blocked-by-immunity.lawcase"

[[cases]]
name = "V8TimelyPetitionSuspendsPeriods"
path = "cases/v8-timely-petition-suspends-periods.lawcase"

[metadata]
act = "us-irc-examples-pilot-individual-2025"
