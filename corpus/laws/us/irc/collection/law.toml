# Manifest §10 — package root marker (DECISION-0033).
[package]
name = "us.irc.collection"
version = "0.1.1"
language = "0.2"
namespace = "urn:us:irc:collection:clir"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "us-irc-collection"
title = "26 U.S.C. Chapters 64, 71-74 — Collection"
primarySource = "IRC_TITLE26"
jurisdiction = "US"
instrument = "code"
sourceFidelity = "pinned_official_bytes"
issuer = "United States Congress; published by the Office of the Law Revision Counsel / U.S. Government Publishing Office"
legalStatus = "in_force"
verifiedAgainstSource = true

# "us.irc.assessment" — WIRE-2 (25.09.2026): imports `pub collection_period_ends`
# (§6502(a)'s general 10-year rule).
[dependencies]
"us.irc.core" = "0.1.1"
"us.irc.assessment" = "0.1.1"
"us.irc.administration" = "0.1.1"
"us.irc.temporal" = "0.1.1"
"us.irc.inflation_adjustments" = "0.1.1"
"us.irc.gross_income" = "0.1.1"
"us.irc.income_individual" = "0.1.1"

[[tests]]
family = "us_irc_collection"
suites = [
    "tests/collection-notice-fair-practices.lawtest",
    "tests/lien-arising-period-priority.lawtest",
    "tests/lien-hearing-and-release.lawtest",
    "tests/levy-hearing-and-power.lawtest",
    "tests/levy-execution.lawtest",
    "tests/estate-gift-liens-redemption-proceeds.lawtest",
    "tests/transferees-fiduciaries-agreements.lawtest",
    "tests/deposits-payment-methods.lawtest",
    "tests/lien-remainder-elections-appeals.lawtest",
    "tests/levy-sale-records-remainder.lawtest",
    "tests/registration-bonds-offer-record-appeals.lawtest",
    "tests/payment-timing-child-support-and-reports.lawtest",
    "tests/definitions-payment-application-license-and-pl119-64.lawtest",
    "tests/collection-stage4.lawtest",
    "tests/wire10-D-consumer-wiring.lawtest",
]
world = ["us.irc.collection", "us.irc.core", "us.irc.assessment", "us.irc.administration", "us.irc.temporal", "us.irc.inflation_adjustments", "us.irc.gross_income", "us.irc.income_individual"]

# Final TECH_GAP pass (26.09.2026): the business-day count of section 6302(e)(1) needs the federal calendar snapshot of section 85.
[[tests]]
family = "us_irc_collection_business_days"
suites = [
    "tests/15-communications-deposit-business-days-final.lawtest",
]
world = ["us.irc.collection", "us.irc.core", "us.irc.assessment", "us.irc.administration", "us.irc.temporal", "us.irc.inflation_adjustments", "us.irc.gross_income", "us.irc.income_individual"]
