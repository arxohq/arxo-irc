# Manifest §10 — package root marker (DECISION-0033). §22 headers live in the
# .law files themselves and must agree with this manifest (LDC-E1109).
[package]
name = "us.irc.core"
version = "0.1.1"
language = "0.2"
namespace = "urn:us:irc:core"

# Catalogue metadata (DECISION-0051). NOT semantics. Core pins no statutory
# BYTES of its own (no edition/publication under `source IRC_TITLE26` in
# `package.law`) — `sourceFidelity = "abstract_only"` records exactly that:
# the package names the title it serves, without claiming to have pinned any
# of its text (see CONTRACT.md, "Metadata" section).
[metadata]
act = "us-irc-core"
title = "26 U.S.C. — shared vocabulary of the Internal Revenue Code formalization (types, roles, periods, events; no norms)"
primarySource = "IRC_TITLE26"
jurisdiction = "US"
instrument = "code"
sourceFidelity = "abstract_only"
verifiedAgainstSource = false
issuer = "United States Congress"
legalStatus = "in_force"

[[tests]]
family = "us_irc_core"
suites = ["tests/core-sanity.lawtest"]
world = ["us.irc.core"]
