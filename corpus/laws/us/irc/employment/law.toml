    # вывод/нет-факта-источника pairs (NOT EXECUTED, implemented_unverified).
    "tests/secretary-withholding-methods.lawtest",
    # IRC-G/G6: 9 rules (section 3302(c)/(d)/(f)/(g) 2025-slice readers) with
    # вывод/нет-факта pairs (NOT EXECUTED, implemented_unverified).
    "tests/futa-credit-reduction-pin.lawtest",
