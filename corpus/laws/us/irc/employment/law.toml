# Manifest §10 — package root marker (DECISION-0033).
[package]
name = "us.irc.employment"
version = "0.1.1"
language = "0.2"
namespace = "urn:us:irc:employment:clir"

# Catalogue metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics.
[metadata]
act = "us-irc-employment"
title = "26 U.S.C. Subtitle C — Employment Taxes"
primarySource = "IRC_TITLE26"
jurisdiction = "US"
instrument = "code"
sourceFidelity = "pinned_official_bytes"
issuer = "United States Congress; published by the Office of the Law Revision Counsel / U.S. Government Publishing Office"
legalStatus = "in_force"
verifiedAgainstSource = true

[dependencies]
"us.irc.definitions" = "0.1.1"
"us.irc.core" = "0.1.1"
"us.irc.income_individual" = "0.1.1"
"us.irc.temporal" = "0.1.1"
# IRC-G/G5: pinned Pub. 15-T (2026) percentage/tolerance tables read by the
# section 3402(b)/(h) from-table legs in 21-secretary-withholding-methods.law.
# The CFR renders (us.cfr.t26_31_3402_b_c_h_m) enter cases as case-selected
# facts (G4 pattern) — no dependency until the registry publishes the package.
"us.irs.pub_15t_2026" = "0.1.1"
# IRC-G/G6: pinned DOL ETA 2025 credit-reduction slice read by the section
# 3302(c)/(d)/(f)/(g) from-pin legs in 22-futa-credit-reduction-from-pin.law.
# Registry publication of the source package (step 6, owner gate) is still
# pending — same as G4/G5.
"us.dol.futa_credit_reduction_2025" = "0.1.1"

[features]
enabled = ["law.params/0.1"]

[[tests]]
family = "us_irc_employment"
suites = [
    "tests/fica-tax.lawtest",
    "tests/fica-definitions.lawtest",
    "tests/fica-administrative.lawtest",
    "tests/income-tax-withholding.lawtest",
    "tests/pension-withholding.lawtest",
    "tests/backup-withholding.lawtest",
    "tests/collection-and-third-parties.lawtest",
    "tests/futa.lawtest",
    "tests/rrta.lawtest",
    "tests/ruia.lawtest",
    "tests/covid-era-employment-credits.lawtest",
    "tests/inventory-remainder-and-pl119-21.lawtest",
    "tests/fica-rrta-special-rules.lawtest",
    "tests/futa-definitions-and-state-law-safeguards.lawtest",
    "tests/futa-state-law-approval-requirements.lawtest",
    "tests/income-tax-withholding-remainder.lawtest",
    "tests/rrta-compensation-definitions.lawtest",
    "tests/fica-definitions-remainder.lawtest",
    "tests/covid-era-credits-remainder.lawtest",
    "tests/pl119-21-short-years.lawtest",
    "tests/wire10-B-owner-contracts.lawtest",
