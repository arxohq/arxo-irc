# Stage 1 (IRC-09, DECISION-0379): Subchapter D core per PLAN family 8 —
# retirement arrangement -> contribution/distribution -> conditions of the
# special regime. Priority: 401(a)(9)/(13)/(17), 401(k)(3), 402(a)/(c)/(g),
# 408(a)/(d), 408A(c)/(d), 409A(a), 410(a)-(b), 411(a), 414(q), 415(b)-(c),
# 416(g), 417. Broader stage-1 scope: 401(a)(3)/(4)/(11)/(30)/(31), 401(k)
# more broadly, 401(m), 402(e)(4), 402A, 403(b) brief, 404, 408(k)/(o)/(p),
# 408A(d)(3), 409A(a)(2)-(4), 410(b), 411(d)(6), 412/430/436 brief contracts,
# 414(b)/(c)/(m)/(v)/(w), 415(d) brief, 416(c)/(g), 417 fully, 419/419A/420
# brief. Everything else stays unreviewed ("stage 2").

